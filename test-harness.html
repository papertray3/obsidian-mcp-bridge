<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Bridge Test Harness</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #3e3e42;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4ec9b0;
        }

        .connection-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-connected {
            background: #0e6027;
            color: #89d185;
        }

        .status-disconnected {
            background: #5a1d1d;
            color: #f48771;
        }

        .status-connecting {
            background: #4d4d00;
            color: #dcdcaa;
        }

        .config-section {
            background: #252526;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #3e3e42;
        }

        .config-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        label {
            min-width: 80px;
            color: #9cdcfe;
        }

        input {
            flex: 1;
            padding: 8px 12px;
            background: #3c3c3c;
            border: 1px solid #555;
            border-radius: 4px;
            color: #d4d4d4;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        input:focus {
            outline: none;
            border-color: #007acc;
        }

        button {
            padding: 8px 16px;
            background: #0e639c;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #1177bb;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .tools-list {
            background: #252526;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3e3e42;
            max-height: 80vh;
            overflow-y: auto;
        }

        .tool-item {
            padding: 10px;
            margin-bottom: 8px;
            background: #2d2d30;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #3e3e42;
            transition: all 0.2s;
        }

        .tool-item:hover {
            background: #37373d;
            border-color: #007acc;
        }

        .tool-item.selected {
            background: #094771;
            border-color: #007acc;
        }

        .tool-name {
            font-weight: 600;
            color: #4ec9b0;
            margin-bottom: 4px;
        }

        .tool-category {
            font-size: 11px;
            color: #858585;
            text-transform: uppercase;
        }

        .tool-description {
            font-size: 12px;
            color: #9cdcfe;
            margin-top: 4px;
        }

        .test-panel {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #3e3e42;
        }

        .no-tool-selected {
            text-align: center;
            padding: 40px;
            color: #858585;
        }

        .tool-details h2 {
            color: #4ec9b0;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #9cdcfe;
            font-size: 14px;
        }

        .form-group .hint {
            font-size: 12px;
            color: #858585;
            margin-top: 4px;
        }

        .required {
            color: #f48771;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            background: #3c3c3c;
            border: 1px solid #555;
            border-radius: 4px;
            color: #d4d4d4;
            font-family: 'Consolas', 'Courier New', monospace;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #007acc;
        }

        select {
            width: 100%;
            padding: 8px 12px;
            background: #3c3c3c;
            border: 1px solid #555;
            border-radius: 4px;
            color: #d4d4d4;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .execute-btn {
            width: 100%;
            padding: 12px;
            background: #0e639c;
            font-size: 16px;
            margin-top: 20px;
        }

        .response-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #3e3e42;
        }

        .response-section h3 {
            color: #4ec9b0;
            margin-bottom: 10px;
        }

        .response-content {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #3e3e42;
            max-height: 400px;
            overflow-y: auto;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            color: #d4d4d4;
        }

        .error {
            color: #f48771;
        }

        .success {
            color: #89d185;
        }

        .loading {
            color: #dcdcaa;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 14px;
        }

        .stat-item {
            color: #858585;
        }

        .stat-value {
            color: #4ec9b0;
            font-weight: 600;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                MCP Bridge Test Harness
                <span id="connectionStatus" class="connection-status status-disconnected">Disconnected</span>
            </h1>
            <div class="stats">
                <div class="stat-item">Tools: <span class="stat-value" id="toolCount">0</span></div>
                <div class="stat-item">Categories: <span class="stat-value" id="categoryCount">0</span></div>
                <div class="stat-item">Version: <span class="stat-value" id="serverVersion">Unknown</span></div>
            </div>
        </header>

        <div class="config-section">
            <div class="config-row">
                <label>Host:</label>
                <input type="text" id="host" value="127.0.0.1">
                <label>Port:</label>
                <input type="number" id="port" value="27125">
            </div>
            <div class="config-row">
                <label>API Key:</label>
                <input type="password" id="apiKey" placeholder="Enter your API key">
                <button id="connectBtn" onclick="connect()">Connect</button>
                <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
            </div>
        </div>

        <div class="main-content">
            <div class="tools-list">
                <h3 style="margin-bottom: 15px; color: #9cdcfe;">Available Tools</h3>
                <div id="toolsList">
                    <div class="no-tool-selected">
                        Connect to load tools
                    </div>
                </div>
            </div>

            <div class="test-panel">
                <div id="toolDetails" class="no-tool-selected">
                    Select a tool to test
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentTool = null;
        let allTools = [];
        let requestId = 1;
        let pendingRequests = new Map();

        function updateConnectionStatus(status, text) {
            const statusEl = document.getElementById('connectionStatus');
            statusEl.className = `connection-status status-${status}`;
            statusEl.textContent = text;
        }

        function connect() {
            const host = document.getElementById('host').value;
            const port = document.getElementById('port').value;
            const apiKey = document.getElementById('apiKey').value;

            if (!apiKey) {
                alert('Please enter an API key');
                return;
            }

            updateConnectionStatus('connecting', 'Connecting...');
            document.getElementById('connectBtn').disabled = true;

            ws = new WebSocket(`ws://${host}:${port}`);

            ws.onopen = () => {
                console.log('WebSocket connected');
                updateConnectionStatus('connected', 'Connected');
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;

                // Test connectivity and get version
                sendRequest('ping', {}).then(result => {
                    document.getElementById('serverVersion').textContent = result.version || 'Unknown';
                });

                // Load tools
                loadTools();
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateConnectionStatus('disconnected', 'Disconnected');
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
                ws = null;
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateConnectionStatus('disconnected', 'Error');
            };

            ws.onmessage = (event) => {
                console.log('Test harness received:', event.data);
                const response = JSON.parse(event.data);
                console.log('Parsed response:', response);
                const { id, result, error } = response;
                console.log(`Looking for request ID: ${id}`);
                console.log(`Pending requests: ${Array.from(pendingRequests.keys()).join(', ')}`);

                if (pendingRequests.has(id)) {
                    const { resolve, reject } = pendingRequests.get(id);
                    pendingRequests.delete(id);

                    if (error) {
                        reject(new Error(error));
                    } else {
                        resolve(result);
                    }
                }
            };
        }

        function disconnect() {
            if (ws) {
                console.log('Disconnecting WebSocket');
                ws.close();
                ws = null;
                updateConnectionStatus('disconnected', 'Disconnected');
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
            }
        }

        function sendRequest(method, params) {
            return new Promise((resolve, reject) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    reject(new Error('Not connected'));
                    return;
                }

                const id = `req-${requestId++}`;
                const apiKey = document.getElementById('apiKey').value;

                const request = {
                    id,
                    method,
                    params,
                    auth: apiKey
                };

                pendingRequests.set(id, { resolve, reject });

                setTimeout(() => {
                    if (pendingRequests.has(id)) {
                        pendingRequests.delete(id);
                        reject(new Error(`Request timeout after 10 seconds (${method})`));
                    }
                }, 10000); // 10 second timeout

                ws.send(JSON.stringify(request));
            });
        }

        async function loadTools() {
            try {
                const result = await sendRequest('tools/list', {});
                allTools = result.tools;

                document.getElementById('toolCount').textContent = allTools.length;

                const categories = new Set(allTools.map(t => t.category).filter(c => c));
                document.getElementById('categoryCount').textContent = categories.size;

                renderToolsList();
            } catch (error) {
                console.error('Failed to load tools:', error);
                document.getElementById('toolsList').innerHTML = `
                    <div class="error">Failed to load tools: ${error.message}</div>
                `;
            }
        }

        function renderToolsList() {
            const toolsList = document.getElementById('toolsList');

            const groupedTools = {};
            allTools.forEach(tool => {
                const category = tool.category || 'other';
                if (!groupedTools[category]) {
                    groupedTools[category] = [];
                }
                groupedTools[category].push(tool);
            });

            let html = '';
            Object.keys(groupedTools).sort().forEach(category => {
                groupedTools[category].forEach(tool => {
                    html += `
                        <div class="tool-item" onclick="selectTool('${tool.name}')">
                            <div class="tool-name">${tool.name}</div>
                            ${tool.category ? `<div class="tool-category">${tool.category}</div>` : ''}
                            <div class="tool-description">${tool.description}</div>
                        </div>
                    `;
                });
            });

            toolsList.innerHTML = html;
        }

        function selectTool(toolName) {
            currentTool = allTools.find(t => t.name === toolName);

            // Update UI
            document.querySelectorAll('.tool-item').forEach(el => {
                el.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');

            renderToolDetails();
        }

        function renderToolDetails() {
            const detailsEl = document.getElementById('toolDetails');

            if (!currentTool) {
                detailsEl.innerHTML = '<div class="no-tool-selected">Select a tool to test</div>';
                return;
            }

            let html = `
                <div class="tool-details">
                    <h2>${currentTool.name}</h2>
                    <p>${currentTool.description}</p>

                    <form id="toolForm" onsubmit="executeTool(event)">
            `;

            // Generate form fields from inputSchema
            const schema = currentTool.inputSchema;
            const properties = schema.properties || {};
            const required = schema.required || [];

            Object.entries(properties).forEach(([key, prop]) => {
                const isRequired = required.includes(key);
                const fieldId = `field_${key}`;

                html += `<div class="form-group">`;
                html += `<label for="${fieldId}">${key}${isRequired ? ' <span class="required">*</span>' : ''}</label>`;

                if (prop.enum) {
                    html += `<select id="${fieldId}" ${isRequired ? 'required' : ''}>`;
                    prop.enum.forEach(val => {
                        html += `<option value="${val}">${val}</option>`;
                    });
                    html += `</select>`;
                } else if (prop.type === 'boolean') {
                    html += `<select id="${fieldId}">`;
                    html += `<option value="true">true</option>`;
                    html += `<option value="false">false</option>`;
                    html += `</select>`;
                } else if (prop.type === 'number') {
                    html += `<input type="number" id="${fieldId}" ${isRequired ? 'required' : ''}>`;
                } else if (key === 'source' || key === 'query') {
                    html += `<textarea id="${fieldId}" ${isRequired ? 'required' : ''}></textarea>`;
                } else {
                    html += `<input type="text" id="${fieldId}" ${isRequired ? 'required' : ''}>`;
                }

                if (prop.description) {
                    html += `<div class="hint">${prop.description}</div>`;
                }

                html += `</div>`;
            });

            html += `
                        <button type="submit" class="execute-btn">Execute Tool</button>
                    </form>

                    <div class="response-section" id="responseSection" style="display: none;">
                        <h3>Response</h3>
                        <div class="response-content">
                            <pre id="responseContent"></pre>
                        </div>
                    </div>
                </div>
            `;

            detailsEl.innerHTML = html;
        }

        async function executeTool(event) {
            event.preventDefault();

            const form = document.getElementById('toolForm');
            const formData = new FormData(form);

            // Build params from form
            const params = {};
            const schema = currentTool.inputSchema;
            const properties = schema.properties || {};

            Object.keys(properties).forEach(key => {
                const fieldId = `field_${key}`;
                const el = document.getElementById(fieldId);
                let value = el.value;

                if (value !== '') {
                    // Type conversion based on schema
                    if (properties[key].type === 'array') {
                        // For arrays, try to parse as JSON; if it fails, treat as comma-separated
                        try {
                            value = JSON.parse(value);
                        } catch {
                            // If not JSON, split by comma and trim
                            value = value.split(',').map(s => s.trim());
                        }
                    } else if (properties[key].type === 'number') {
                        value = parseFloat(value);
                    } else if (properties[key].type === 'boolean') {
                        value = value === 'true';
                    }
                    params[key] = value;
                }
            });

            // Show loading
            const responseSection = document.getElementById('responseSection');
            const responseContent = document.getElementById('responseContent');
            responseSection.style.display = 'block';
            responseContent.innerHTML = '<span class="loading">Executing...</span>';

            try {
                const result = await sendRequest(currentTool.name, params);
                responseContent.className = 'success';
                responseContent.textContent = JSON.stringify(result, null, 2);
            } catch (error) {
                responseContent.className = 'error';
                responseContent.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
