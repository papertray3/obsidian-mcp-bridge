version: "2.0"

config:
  auto_reload: true                  # Watch for file changes
  sandbox_user_scripts: true         # Run user scripts in sandbox
  enable_auto_generation: false      # Phase III: auto-gen from classes

tools:
  # Built-in tools (part of plugin core)
  builtin:
    - name: ping
      description: Test connectivity to the MCP Bridge
      handler: builtin
      inputSchema:
        type: object
        properties: {}
      outputSchema:
        type: object
        properties:
          status:
            type: string
          timestamp:
            type: number
          version:
            type: string

    - name: search_files
      description: Search for files in the vault using glob patterns
      handler: builtin
      category: search
      inputSchema:
        type: object
        properties:
          pattern:
            type: string
            description: Glob pattern to match (e.g., "*.md", "Notes/**/*.md")
        required: [pattern]
      outputSchema:
        type: object
        properties:
          files:
            type: array
            items:
              type: string

    - name: get_note_raw
      description: Get raw markdown content of a note
      handler: builtin
      category: notes
      inputSchema:
        type: object
        properties:
          filepath:
            type: string
            description: Path to note relative to vault root
        required: [filepath]
      outputSchema:
        type: object
        properties:
          filepath:
            type: string
          content:
            type: string

    - name: list_vault_files
      description: List all markdown files in the vault or a specific folder
      handler: builtin
      category: notes
      inputSchema:
        type: object
        properties:
          folder:
            type: string
            description: Optional folder to list files from (relative to vault root)
      outputSchema:
        type: object
        properties:
          files:
            type: array
            items:
              type: object

    - name: run_dataview_block
      description: Execute a Dataview or DataviewJS query block and return rendered results
      handler: builtin
      category: dataview
      inputSchema:
        type: object
        properties:
          flavor:
            type: string
            enum: [dataview, dataviewjs]
            description: Type of query - 'dataview' for DQL or 'dataviewjs' for JavaScript
          source:
            type: string
            description: The query or script source code (without the ```dataview wrapper)
          filepath:
            type: string
            description: Optional path to note file to use as execution context (for this.file, dv.current(), etc.)
          input:
            description: Optional input data to pass to DataviewJS scripts (available as 'input' variable)
        required: [flavor, source]
      outputSchema:
        type: object
        properties:
          success:
            type: boolean
          renderedMarkdown:
            type: string
          renderedHtml:
            type: string
          elapsedMs:
            type: number
          errors:
            type: array
            items:
              type: string

    - name: extract_dataview_blocks
      description: Extract all Dataview and DataviewJS blocks from a note with their source code, type, and line numbers
      handler: builtin
      category: dataview
      inputSchema:
        type: object
        properties:
          filepath:
            type: string
            description: Path to the note file (relative to vault root)
        required: [filepath]
      outputSchema:
        type: object
        properties:
          success:
            type: boolean
          blocks:
            type: array
            items:
              type: object
              properties:
                flavor:
                  type: string
                  enum: [dataview, dataviewjs]
                source:
                  type: string
                lineStart:
                  type: number
                lineEnd:
                  type: number
          errors:
            type: array
            items:
              type: string

  # User-added custom tools
  user:
    - name: create_note_from_fileclass
      description: Create a new note with proper frontmatter based on a Metadata Menu fileClass definition
      handler: user/create-note-from-fileclass.js
      category: notes
      tags: [metadata, fileclass, creation]
      inputSchema:
        type: object
        properties:
          fileClass:
            type: string
            description: "FileClass name (e.g., 'project', 'recipe', 'step', 'doc')"
          title:
            type: string
            description: "Note title/name"
          path:
            type: string
            description: "Optional: Full path where to create the file (defaults to appropriate location based on fileClass)"
          initialValues:
            type: object
            description: "Optional: Key-value pairs to pre-populate frontmatter fields"
        required: [fileClass, title]
      outputSchema:
        type: object
        properties:
          success:
            type: boolean
          filePath:
            type: string
          frontmatter:
            type: object

    # Example (uncomment to enable):
    # - name: my_custom_tool
    #   description: A custom tool I created
    #   handler: user/my_tool.js
    #   category: custom
    #   inputSchema:
    #     type: object
    #     properties:
    #       param1:
    #         type: string
    #         description: Description of parameter
    #     required: [param1]

  # Auto-generated tools (Phase III)
  auto: []
